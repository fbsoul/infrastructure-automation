---
# site.yml
# Master Infrastructure-as-Code Configuration Management Playbook
# Enterprise Core Orchestration Layer
# Architected by: Vinny Firas Bsoul (Linux Infrastructure Engineer)

- name: Stage 1 — Baseline Operating System Configuration
  hosts: all_vms
  become: true
  gather_facts: true
  roles:
    - role: os_configuration
      tags: [os-config, os_configuration]

- name: Stage 2 — Performance Optimization
  hosts: loadbalancers, webservers
  become: true
  gather_facts: false
  roles:
    - role: performance
      tags: [performance]

- name: Stage 3 — Security Enforcement & Hardening
  hosts: all_vms
  become: true
  gather_facts: false
  roles:
    - role: security
      tags: [security]

- name: Stage 4 — Identity & Access Administration
  hosts: all_vms
  become: true
  gather_facts: false
  roles:
    - role: useradmin
      tags: [useradmin]

- name: Stage 5 — Application Delivery Layer
  hosts: loadbalancers
  become: true
  gather_facts: false
  roles:
    - role: nginx_lb
      tags: [lb, proxy, nginx]
