apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: webapp
  labels:
    app: webapp

spec:
  replicas: 6

  selector:
    matchLabels:
      app: webapp

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: webapp
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: webapp
          matchLabelKeys:
            - pod-template-hash

      containers:
        - name: webapp
          image: ghcr.io/fbsoul/webapp:4213c3f212d8bf608bfcf3053c269c430ccce1d1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
