apiVersion: apps/v1
kind: Deployment

metadata:
  name: webapp
  namespace: webapp
  labels:
    app: webapp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: webapp

  template:
    metadata:
      labels:
        app: webapp

    spec:
      containers:
        - name: webapp
          image: ghcr.io/fbsoul/webapp:PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
