apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: webapp-cd
  namespace: webapp

rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - create
      - patch
      - watch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
