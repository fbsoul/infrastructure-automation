apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: webapp-cd
  namespace: webapp

rules:
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/status
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch

  - apiGroups:
      - ""
    resources:
      - pods
      - pods/status
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
